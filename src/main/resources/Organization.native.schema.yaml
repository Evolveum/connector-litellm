# LiteLLM Organization - native (REST/JSON) schema.
# Data comes from GET /organization/list (bare array) and GET /organization/info?org_id=....
# Organizations are a LiteLLM Enterprise feature: on community deployments the endpoints
# answer 403 with an "enterprise only" detail.
objectClasses:
  Organization:
    description: "A LiteLLM organization (enterprise feature) grouping users and teams"
    attributes:
      organization_id:
        jsonType: string
        description: "Unique organization identifier"
      organization_alias:
        jsonType: string
        description: "Human readable alias of the organization"
      budget_id:
        jsonType: string
        description: "Id of the default budget of the organization"
      spend:
        jsonType: number
        openApiFormat: double
        description: "Current spend (USD) of the organization"
      models:
        jsonType: string
        multiValued: true
        description: "Models the organization is allowed to access (empty means all)"
      created_by:
        jsonType: string
        description: "User that created the organization"
      updated_by:
        jsonType: string
        description: "User that updated the organization last"
      created_at:
        jsonType: string
        openApiFormat: date-time
        description: "Creation timestamp"
      updated_at:
        jsonType: string
        openApiFormat: date-time
        description: "Last update timestamp"

