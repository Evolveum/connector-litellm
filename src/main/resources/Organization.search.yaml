# LiteLLM Organization - search operations.
# Organizations are an enterprise-only feature; on community deployments the
# endpoints answer 403. GET /organization/list lists organizations (bare JSON
# array, filterable by org_id / org_alias); GET /organization/info reads one
# (it requires the organization_id parameter).
objectClasses:
  Organization:
    search:
      endpoints:
        # The UID attribute (organization_id) is deliberately not mapped here: declaring it on
        # both endpoints would let the filter dispatcher pick either of them, and the choice is
        # not deterministic. By-UID reads go to /organization/info below.
        - path: /organization/list
          responseFormat: JSON_ARRAY
          emptyFilterSupported: true
          supportedFilters:
            - spec: attribute("organization_alias").eq().anySingleValue()
              request: |
                request.queryParameter("org_alias", value)
        - path: /organization/info
          singleResult: true
          # organization_id is bound to __UID__, so this entry also serves UID filters.
          supportedFilters:
            - spec: attribute("organization_id").eq().anySingleValue()
              request: |
                request.queryParameter("organization_id", value)
